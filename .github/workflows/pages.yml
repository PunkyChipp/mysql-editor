name: Publish Study Desk to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend build dependencies
        run: npm ci
      - name: Check statement selection and rebuild the bundled editor
        run: |
          npm test
          npm run build
          git diff --exit-code -- desk/assets/app.js
      - name: Check Python and shell sources
        run: |
          python3 -m compileall -q launch.py desk_api.py desk scripts tests
          sh -n editor/entrypoint.sh
          python3 tests/test_codespace_boot.py -v
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build browser start page
        run: python3 scripts/build_pages.py --repository "$GITHUB_REPOSITORY"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public start page
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
